<div class="app-layout">
    <header class="app-header">
        <div class="header-content">
            <div class="fw-bold">EQUIPO BASKET</div>
            <h2 class="team-name">Milwaukee Bucks</h2>
        </div>
    </header>

    <main class="dashboard">
        <aside class="sidebar-players">
            <app-players (playerSelected)="onPlayerSelected($event)"></app-players>
        </aside>

        <section class="main-content">
            <app-detail [player]="selectedPlayer"></app-detail>
            <app-media [player]="selectedPlayer"></app-media>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Equipo Basket - Proyecto Frontend Milwaukee Bucks</p>
    </footer>
</div>
