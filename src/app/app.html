<header>
    <h1 class="titulo">EQUIPO BASKET</h1>
    <h2>Milwaukee Bucks</h2>
</header>
<div class="container">
    <hr>
    <div class="row">
        <div class="app-players">
            <app-players (playerSelected)="onPlayerSelected($event)"></app-players>

        <div class="app-detail">

            <app-media [player]="selectedPlayer"></app-media>
        </div>
    </div>
    <footer>
        <p>Footer</p>
    </footer>
</div>
