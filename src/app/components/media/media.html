<div class="media-container" *ngIf="player; else unselected">
  
  <div class="media-section" *ngIf="player.imagen">
    <h4>Imagen de {{ player.nombre }}</h4>
    <img [src]="player.imagen" [alt]="'Imagen de ' + player.nombre" class="player-image">
  </div>
  
  <div class="media-section" *ngIf="player.videoUrl">
    <h4>Video destacado</h4>
    <div class="video-wrapper">
      <video #mediaVideo [src]="player.videoUrl" width="100%" [muted]="isMuted" controls preload="metadata"></video>
      <div class="video-controls mt-2">
        <button class="btn btn-primary" (click)="playVideo()">Play</button>
        <button class="btn btn-secondary ms-2" (click)="pauseVideo()">Pause</button>
        <button class="btn btn-outline-dark ms-2" (click)="toggleMute()">
          {{ isMuted ? 'Unmute' : 'Mute' }}
        </button>
      </div>
    </div>
  </div>

</div>

<ng-template #unselected>
  <div class="empty-state">
    <p>Selecciona un jugador para ver su contenido multimedia</p>
  </div>
</ng-template>
