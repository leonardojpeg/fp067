<div *ngIf="jugador" class="mt-3">
  <div class="card shadow border-warning">
    <div class="card-header bg-dark text-warning">
      <strong>🎥 Jugadas Destacadas: {{ jugador.nombre }}</strong>
    </div>
    <div class="ratio ratio-16x9">
      <iframe [src]="getSafeUrl(jugador.video)" 
              title="YouTube video player" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
      </iframe>
    </div>
  </div>
</div>

<div *ngIf="!jugador" class="alert alert-light text-center border-dashed">
  <p class="mb-0">Selecciona un crack de la lista para ver su vídeo</p>
</div>
