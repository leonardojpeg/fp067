<div *ngIf="jugador" class="card border-danger shadow">
  <div class="card-body text-center">
    <h3 class="card-title text-danger fw-bold">{{ jugador.nombre }} {{ jugador.apellidos }}</h3>
    <hr>
    
    <div class="mb-3">
      <p class="mb-1"><strong>Posición:</strong> {{ jugador.posicion }}</p>
      <p class="mb-1"><strong>Edad:</strong> {{ jugador.edad }} años</p>
      <p class="mb-1"><strong>Altura:</strong> {{ jugador.altura }}</p>
    </div>

    <p class="text-muted small mt-3 mb-2">🎥 Jugadas Destacadas</p>

    <div style="border-radius: 12px; overflow: hidden; background: #000;">
      <iframe 
        [src]="jugador.video | safe" 
        width="100%" 
        height="250" 
        frameborder="0" 
        allowfullscreen>
      </iframe>
    </div>
  </div>
</div>

<div *ngIf="!jugador" class="p-5 border rounded bg-light text-center text-muted">
  <p>Selecciona un jugador para ver su ficha</p>
</div>
